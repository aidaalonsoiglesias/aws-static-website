name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-west-2

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infrastructure == 'true' }}
      website: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.website == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infrastructure:
              - 'infrastructure/**'
            website:
              - 'website/**'

  terraform:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_profile: ""
      TF_INPUT: "false"
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - run: terraform apply tfplan

  website:
    needs: [changes, terraform]
    # Runs after terraform when it ran; still runs if terraform was skipped, never if it failed.
    if: >-
      !cancelled() && !failure() &&
      needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    env:
      BUCKET: static-website-dev-061700273493
    steps:
      - uses: actions/checkout@v4
      - run: aws s3 sync website/ s3://$BUCKET --delete
