name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-west-2

jobs:
  infrastructure-deploy:
    name: Infrastructure deploy
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_profile: ""
      TF_INPUT: "false"
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            infra:
              - 'infrastructure/**'
      # Manual runs have no diff, so they always deploy.
      - if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v3
      - if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.infra == 'true'
        run: |
          terraform fmt -check -recursive
          terraform init
          terraform validate
          terraform plan -out=tfplan
          terraform apply tfplan

  s3-deploy:
    name: S3 deploy
    needs: infrastructure-deploy
    # Runs after infrastructure deploy, but not if it failed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      BUCKET: static-website-dev-061700273493
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            website:
              - 'website/**'
      - if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.website == 'true'
        run: aws s3 sync website/ s3://$BUCKET --delete
